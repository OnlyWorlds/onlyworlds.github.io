# Pull requests: build the site and run the URL gate, without deploying.
# Also reports (never fails on) element pages that are behind schema-dist; the deploy regenerates
# them anyway, so a stale page in git is only a reviewing aid.
name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          npm ci
          pip install pyyaml
      - name: Element pages against schema-dist (report only)
        run: |
          git clone --depth 1 https://github.com/OnlyWorlds/schema-dist "$RUNNER_TEMP/schema-dist" || { echo "::warning::schema-dist could not be cloned: the element pages were not checked"; exit 0; }
          python scripts/gen_elements.py --dist "$RUNNER_TEMP/schema-dist" --check || echo "::warning::element pages in git are behind schema-dist; the deploy regenerates them"
      - name: Error codes against the live API (report only)
        run: |
          node scripts/gen_errors.mjs --live || echo "::warning::keel's error-code list moved: run node scripts/gen_errors.mjs --refresh and give each new code a section"
      - name: MCP tools and resources against the live server (report only)
        run: |
          node scripts/verify-mcp.mjs --live || echo "::warning::the MCP server's tools or resources moved: run node scripts/verify-mcp.mjs --refresh and mend the MCP page's tables"
      - name: CORS headers against a live preflight (report only)
        run: |
          node scripts/verify-cors.mjs --live || echo "::warning::the live CORS answer differs from contract/cors.json: read keel's settings with node scripts/verify-cors.mjs --source, --refresh, and mend the CORS page"
      - name: Toolkit skills against its newest release (report only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-toolkit.mjs --live || echo "::warning::the toolkit's newest release has other skills or agents: run node scripts/verify-toolkit.mjs --refresh and mend the Toolkit page and the LLM guide"
      - name: API examples' and tables' schemas against the live API document (report only)
        run: |
          node scripts/verify-shapes.mjs --live || echo "::warning::a schema the API pages' examples or tables name moved in the API document: run node scripts/verify-shapes.mjs --refresh and mend the examples and tables it fails"
      - name: The pages' limits against the live API document (report only)
        run: |
          node scripts/verify-limits.mjs --live || echo "::warning::a limit moved in the API document's x-ow-limits: run node scripts/verify-limits.mjs --refresh and mend the pages it fails"
      - name: The stability page against the live API document (report only)
        run: |
          node scripts/verify-stability.mjs --live || echo "::warning::the API document's policy paragraph, an announced change or a deprecated mark moved: run node scripts/verify-stability.mjs --refresh and mend the Stability and deprecation page"
      - name: The API document's type descriptions against the type pages (report only)
        run: |
          node scripts/verify-groups.mjs || echo "::warning::the API document's description of an element type is not its page's opening sentences: node scripts/verify-groups.mjs names each"
      - name: schema-dist's counts against its newest serial (report only)
        run: |
          node scripts/verify-sd-counts.mjs --live || echo "::warning::schema-dist's newest serial has other fixture counts, refusal reasons or canonical version: run node scripts/verify-sd-counts.mjs --refresh and mend the pages"
      - name: The practice world's key and PIN against production (report only)
        run: |
          node scripts/verify-practice.mjs --live || echo "::warning::production does not answer the practice world's key and PIN as contract/practice.json says: copy keel's contract/practice.json and mend the pages"
      - name: The pages' Python examples against the newest onlyworlds (report only)
        run: |
          { pip install --quiet onlyworlds mypy && python scripts/verify-examples-py.py; } || echo "::warning::a Python example on the pages does not type-check against the newest onlyworlds, or the check could not run: run python scripts/verify-examples-py.py and mend the page"
      - run: npm run build
      - run: npm run verify
