# Pull requests: build the site and run the URL gate, without deploying.
# Also reports (never fails on) element pages that are behind schema-dist; the deploy regenerates
# them anyway, so a stale page in git is only a reviewing aid.
name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          npm ci
          pip install pyyaml
      - name: Element pages against schema-dist (report only)
        run: |
          git clone --depth 1 https://github.com/OnlyWorlds/schema-dist "$RUNNER_TEMP/schema-dist"
          python scripts/gen_elements.py --dist "$RUNNER_TEMP/schema-dist" --check || echo "::warning::element pages in git are behind schema-dist; the deploy regenerates them"
      - name: Error codes against the live API (report only)
        run: node scripts/gen_errors.mjs --live || echo "::warning::keel's error-code list moved: run node scripts/gen_errors.mjs --refresh and give each new code a section"
      - run: npm run build
      - run: npm run verify
