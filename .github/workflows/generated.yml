# The pages the build writes, as committed: the TypeScript reference (scripts/gen_sdk_ref.mjs, from
# the SDK version package.json pins) and the errors table (scripts/gen_errors.mjs, from
# contract/error-codes.json). The deploy regenerates both, so the live site is right either way;
# this holds the copy in git, which is what a reader of the repository and every diff sees, to the
# pin. A pin bump committed without its regenerated page fails here. It never blocks a deploy.
name: Generated pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The TypeScript reference against the pinned SDK
        run: |
          node scripts/gen_sdk_ref.mjs --check || { echo "::error::typescript.md's reference is not what the pinned SDK writes: run node scripts/gen_sdk_ref.mjs and commit the page"; exit 1; }
      - name: The errors table against contract/error-codes.json
        run: |
          node scripts/gen_errors.mjs --check || { echo "::error::the errors page or the URL contract's floor is not what contract/error-codes.json writes: run node scripts/gen_errors.mjs and commit"; exit 1; }
