# Build and deploy the docs (Starlight) to GitHub Pages.
# Runs on every push to main, every 4 hours (so the element pages follow schema-dist without a
# commit), and by hand. The URL gate runs before the upload: a build that breaks a contract URL
# (contract/urls.tsv) never deploys.
name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          pip install pyyaml
      - name: Element pages from schema-dist
        run: |
          git clone --depth 1 https://github.com/OnlyWorlds/schema-dist "$RUNNER_TEMP/schema-dist"
          python scripts/gen_elements.py --dist "$RUNNER_TEMP/schema-dist"
      - name: Build
        run: npm run build
      - name: URL gate
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every deploy from a push or a manual run is tagged docs-live-<date>-<run>, so a rollback is a
  # manual run of this workflow on the previous tag. The 4-hourly rebuilds are not tagged (same source).
  tag:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="docs-live-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
